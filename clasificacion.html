<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clasificación y Llaves | Mundial FIFA 2026</title>
  <meta name="description" content="Tablas de posiciones por grupo y llaves de la fase de eliminación directa.">

  <link rel="icon" href="assets/img/logo/logo-mundial-2026.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>

  <div id="header"></div>

  <main>
    <section class="seccion">
      <div class="container">
        <h1 class="titulo-pagina">Clasificación y Llaves</h1>

        <div class="text-center mb-4">
          <div class="toggle-vista" role="tablist">
            <button class="activo" id="tabGrupos" role="tab">Fase de Grupos</button>
            <button id="tabLlaves" role="tab">Eliminación Directa</button>
          </div>
        </div>

        <div id="vistaGrupos">
          <div class="aviso-alineacion mb-3" id="avisoCalculada" hidden>
            <i class="bi bi-info-circle" style="color:var(--oro-fuerte);font-size:1.1rem"></i>
            <div>
              <strong>Tablas calculadas</strong>
              <p>La API aún no publica las posiciones oficiales, así que se
                 calculan a partir de los partidos ya disputados.</p>
            </div>
          </div>
          <div class="d-flex justify-content-end mb-3">
            <select class="form-select buscador-wc w-auto" id="filtroGrupo">
              <option value="">Todos los grupos</option>
            </select>
          </div>
          <div class="row g-4" id="listaGrupos"></div>
        </div>

        <div id="vistaLlaves" hidden>
          <div class="card-wc p-3 p-md-4">
            <div class="bracket" id="bracket"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Datos de respaldo (solo se usan si la API no responde) -->
  <script src="data/mock.js"></script>

  <!-- Módulos compartidos, en orden de dependencia -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/componentes.js"></script>

  <!-- Script propio de esta página -->
  <script src="assets/js/paginas/clasificacion.js"></script>
</body>
</html>
