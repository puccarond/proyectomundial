<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Mundial FIFA 2026</title>
  <meta name="description" content="Formulario de contacto del portal del Mundial 2026.">

  <link rel="icon" href="assets/img/logo/logo-mundial-2026.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>

  <div id="header"></div>

  <main>
    <section class="seccion">
      <div class="container">
        <h1 class="titulo-pagina">Contacto</h1>
        <p class="text-center text-muted-wc mb-4">¿Tienes dudas o sugerencias? Escríbenos.</p>

        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card-wc p-4 p-md-5">
              <form id="formContacto" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="nombre">Nombre completo *</label>
                    <input type="text" class="form-control buscador-wc" id="nombre" name="nombre" required minlength="3">
                    <div class="invalid-feedback">Escribe tu nombre (mínimo 3 caracteres).</div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="correo">Correo electrónico *</label>
                    <input type="email" class="form-control buscador-wc" id="correo" name="correo" required>
                    <div class="invalid-feedback">Escribe un correo válido.</div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="asunto">Asunto *</label>
                    <select class="form-select buscador-wc" id="asunto" name="asunto" required>
                      <option value="">Selecciona…</option>
                      <option>Consulta general</option>
                      <option>Reportar un error</option>
                      <option>Sugerencia</option>
                      <option>Prensa</option>
                    </select>
                    <div class="invalid-feedback">Selecciona un asunto.</div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="telefono">Teléfono (opcional)</label>
                    <input type="tel" class="form-control buscador-wc" id="telefono" name="telefono">
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="mensaje">Mensaje *</label>
                    <textarea class="form-control buscador-wc" id="mensaje" name="mensaje" rows="5" required minlength="10"></textarea>
                    <div class="invalid-feedback">El mensaje debe tener al menos 10 caracteres.</div>
                  </div>
                  <div class="col-12">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="acepto" required>
                      <label class="form-check-label small" for="acepto">
                        Acepto que mis datos se usen para responder a esta solicitud. *
                      </label>
                      <div class="invalid-feedback">Debes aceptar para continuar.</div>
                    </div>
                  </div>
                  <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-verde">Enviar mensaje</button>
                    <button type="reset" class="btn btn-fantasma">Limpiar</button>
                  </div>
                </div>
              </form>
              <div id="respuestaForm" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Datos de respaldo (solo se usan si la API no responde) -->
  <script src="data/mock.js"></script>

  <!-- Módulos compartidos, en orden de dependencia -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/componentes.js"></script>

  <!-- Script propio de esta página -->
  <script src="assets/js/paginas/contacto.js"></script>
</body>
</html>
