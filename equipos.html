<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selecciones Participantes | Mundial FIFA 2026</title>
  <meta name="description" content="Las selecciones que buscarán la gloria en 2026, filtrables por confederación.">

  <link rel="icon" href="assets/img/logo/logo-mundial-2026.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>

  <div id="header"></div>

  <main>
    <section class="seccion">
      <div class="container">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
          <div>
            <h1 class="titulo-pagina text-start mb-1">Selecciones Participantes</h1>
            <p class="text-muted-wc mb-0" id="subtituloEquipos">Conoce a las selecciones clasificadas.</p>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <input type="search" class="buscador-wc" id="buscador" placeholder="Buscar equipo…" aria-label="Buscar equipo">
            <select class="form-select buscador-wc w-auto" id="filtroConfederacion">
              <option value="">Todas (Confederaciones)</option>
            </select>
          </div>
        </div>
        <p class="text-muted-wc small mb-3" id="contadorEquipos"></p>
        <div class="row g-4" id="listaEquipos"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Datos de respaldo (solo se usan si la API no responde) -->
  <script src="data/mock.js"></script>

  <!-- Módulos compartidos, en orden de dependencia -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/componentes.js"></script>

  <!-- Script propio de esta página -->
  <script src="assets/js/paginas/equipos.js"></script>
</body>
</html>
